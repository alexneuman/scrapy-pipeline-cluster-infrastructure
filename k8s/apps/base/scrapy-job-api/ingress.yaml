apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress
  namespace: jobs
spec:
  ingressClassName: nginx
  rules:
  - host: jobs.askaboutmydad.shop
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: scrapy-job-api
            port:
              number: 8080