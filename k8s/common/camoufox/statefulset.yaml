apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: camoufox
  # namespace: camoufox
spec:
  # replicas: 1
  serviceName: camoufox
  selector:
    matchLabels:
      app: camoufox
  template:
    metadata:
      labels:
        app: camoufox
    spec:
      containers:
      - name: camoufox-server
        image: alexshrugged92/camoufox-server-vnc
        ports:
        - containerPort: 59001
        - containerPort: 6080
        readinessProbe:
          exec:
            command:
              - sh
              - -c
              - |
                if [ -n "${CAMOUFOX_TEST_URL}" ]; then
                  echo "sleeping 30!!"
                  sleep 20
                else
                  sleep 10
                fi
                curl -sf http://127.0.0.1:59001/ || exit 1
          timeoutSeconds: 80
          periodSeconds: 10
        livenessProbe:
          exec:
            command:
              - "curl"
              - "localhost:59001"
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 1
        env:
          - name: ENABLE_VNC
            value: "true"
          - name: CAMOUFOX_HEADLESS
            value: "false"
          - name: CAMOUFOX_TEST_URL
            value: "https://www.realestate.com.au/property-townhouse-vic-tarneit-144701196"
          - name: CAMOUFOX_SUCCESS_XPATH
            value: "//div[@class='property-info__header']"
          - name: CAMOUFOX_TEST_XPATH_TIMEOUT
            value: "10000"