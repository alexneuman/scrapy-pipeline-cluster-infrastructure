apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: applicationset-dev
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - name: ingress-nginx
            namespace: ingress-nginx
          # - name: cert-manager
          #   namespace: cert-manager
          - name: prometheus
            namespace: prometheus
          - name: metallb
            namespace: metallb-system
            projectName: metallb-controller   # optional override example
  template:
    metadata:
      name: '{{if .projectName}}{{.projectName}}{{else}}{{.name}}{{end}}'
    spec:
      project: default
      source:
        repoURL: 'https://github.com/alexneuman/scrapy-pipeline-cluster-infrastructure.git'
        targetRevision: test
        path: 'k8s/helm/charts/{{name}}'
        helm:
          valueFiles:
            - "../../charts/{{name}}/values.yaml"
            - "../../values/dev/{{name}}/values.yaml"
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
