apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: scrapy-job
  labels:
    app: scrapy-job
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scrapy-job
  template:
    metadata:
      labels:
        app: scrapy-job
    spec:
      containers:
        - name: scrapy-job
          image: scrapy-job
          env:
            - name: SCRAPY_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: CAMOUFOX_NAMESPACE
              value: default
